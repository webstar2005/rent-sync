name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --noEmit 2>&1 | head -n 200; npx tsc -b

      - name: Lint
        run: npm run lint --if-present

      - name: RLS tests (placeholder until Phase 1)
        run: |
          if [ -f "supabase/tests/rls.test.sql" ] || [ -f "tests/rls.test.ts" ]; then
            echo "Running RLS suite..."
            # example: npx supabase test or npm run test:rls
            npm run test:rls --if-present
          else
            echo "No RLS tests yet — Phase 1 will add pgTAP/integration suite (PLAN.md 11.3)."
          fi

      - name: Build
        run: npm run build

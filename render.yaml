# Rent Sync — Express backend deploy config for Render (Blueprint spec).
# rootDir lets Render build only property-app/backend inside this monorepo.
#
# How to use:
#   1. In Render: New + -> Blueprint -> select this GitHub repo.
#   2. Render prompts for the `sync: false` secrets below (set them there, never in git).
#   3. Pick Node runtime version 22 when creating the service.
#   4. Verify on the free instance first, then flip the service's Settings -> Instance Type
#      to Starter ($7/mo) so PayHero webhooks never wait on a cold start.
#
# Database: point DATABASE_URL at the Neon Postgres DIRECT connection string (not the -pooler one)
# and apply property-app/backend/database/schema.sql + migrations manually BEFORE first deploy
# (the app does NOT auto-migrate in production). See docs/DEPLOY-RENDER-CLOUDFLARE-NEON.md.

services:
  - type: web
    name: rentsync-api
    runtime: node
    rootDir: property-app/backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGIN
        # Fail-closed CORS: dashboard + marketing site (the /pay STK Push form) are allowed.
        value: https://app.rentsync.africa,https://rentsync.africa,https://www.rentsync.africa
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false # >= 32 chars (openssl rand -hex 32)
      - key: CRON_SECRET
        sync: false # >= 16 chars
      # Monthly rent invoices are generated in-process, not by an external cron. Defaults are 6-hourly
      # and enabled; set to false to switch invoicing off entirely (the Generate invoices button and
      # POST /api/cron/invoices both keep working).
      - key: INVOICE_SCHEDULER_ENABLED
        value: "true"
      - key: INVOICE_SCHEDULER_INTERVAL_HOURS
        value: "6"
      - key: PAYHERO_WEBHOOK_SECRET
        sync: false # >= 16 chars, matches x-payhero-webhook-secret / ?secret=
      - key: PAYHERO_AUTH_TOKEN
        sync: false # PayHero portal -> API Keys
      - key: PAYHERO_ACCOUNT_ID
        sync: false # PayHero profile page
      # Safaricom Daraja STK Push (sandbox first — flip MPESA_BASE_URL when going live)
      - key: MPESA_CONSUMER_KEY
        sync: false # Daraja portal app credentials
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false # the Paybill number Safaricom issued
      - key: MPESA_PASSKEY
        sync: false # Lipa Na M-Pesa passkey
      - key: MPESA_BASE_URL
        value: https://sandbox.safaricom.co.ke